name: Keystore yaratish (faqat bir marta)

on:
  workflow_dispatch:
    inputs:
      parol:
        description: "Imzo kaliti uchun parol (kamida 8 ta belgi, faqat harf va raqam)"
        required: true
        type: string

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Java o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Keystore yaratish
        env:
          PAROL: ${{ inputs.parol }}
        run: |
          if [ ${#PAROL} -lt 8 ]; then
            echo "::error::Parol kamida 8 ta belgi bo'lsin"
            exit 1
          fi
          keytool -genkeypair -v -keystore upload.jks -storetype PKCS12 \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PAROL" -keypass "$PAROL" \
            -dname "CN=Qarz Daftar, O=Dokon, C=UZ"
          base64 -w 0 upload.jks > keystore_base64.txt

      - name: Natijani saqlash (1 kundan keyin o'chadi)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore_base64.txt
          retention-days: 1
